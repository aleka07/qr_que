# Main domain - return 404
server {
    listen 80;
    listen 443 ssl http2;
    server_name kaskyralmaty.dev;

    ssl_certificate /etc/letsencrypt/live/kaskyralmaty.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskyralmaty.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 404;
    }
}

# API Backend
server {
    listen 80;
    server_name api.kaskyralmaty.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.kaskyralmaty.dev;

    ssl_certificate /etc/letsencrypt/live/kaskyralmaty.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskyralmaty.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # WebSocket upgrade headers
    location /api/ws {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Regular API endpoints
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Staff Dashboard
server {
    listen 80;
    server_name staff.kaskyralmaty.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staff.kaskyralmaty.dev;

    ssl_certificate /etc/letsencrypt/live/kaskyralmaty.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaskyralmaty.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/projects/qr_que/frontend/staff/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

